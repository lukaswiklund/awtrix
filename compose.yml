services:
  awtrix:
    build: .
    image: awtrix-bridge
    container_name: awtrix-bridge
    restart: unless-stopped

    # Must match the owner of the Claude and Codex credential directories on
    # the host; a mismatch prevents their usage apps from loading data.
    user: "1000:1000"

    # Device address and Dexcom credentials. Everything else is hardcoded in
    # awtrix/config.py.
    env_file: .env

    environment:
      # Log timestamps only -- glucose ages are computed from tz-aware values.
      TZ: Europe/Stockholm

    # Claude Code rotates the OAuth token, so mount the directory rather than
    # the file: a bind-mounted file would keep pointing at the replaced inode.
    #
    # Not $HOME: under `sudo docker compose` HOME is /root, and Docker would
    # silently create an empty /root/.claude and mount that -- the claude app
    # then disappears without cached usage. CLAUDE_DIR comes from .env,
    # which compose reads from the project directory regardless of who invokes
    # it, and `:?` turns a missing value into a loud error instead.
    volumes:
      - ${CLAUDE_DIR:?set CLAUDE_DIR in .env to the home dir holding .claude}/.claude:/home/app/.claude:ro
      # Codex refreshes and atomically replaces auth.json, so mount its
      # directory read-write rather than bind-mounting that one file.
      - ${CODEX_DIR:?set CODEX_DIR in .env to the home dir holding .codex}/.codex:/home/app/.codex

    # The bridge reaches the device over the LAN; no ports are published.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
